# プロジェクト名を明示（未指定だとフォルダ名から決まり、リネーム時に
# 別プロジェクト扱いでボリュームが作り直されてしまうため）
name: dryeyes

services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    container_name: dryeyes-changedetection
    hostname: changedetection
    volumes:
      - changedetection-data:/datastore
    environment:
      - PLAYWRIGHT_DRIVER_URL=ws://sockpuppetbrowser:3000
      - BASE_URL=http://localhost:5000
      - HIDE_REFERER=true
    # BFF と同じホストからしか使わないので、ループバックに閉じる。
    # LAN へ出したままだと、同じネットワークに居る誰でも changedetection.io の
    # API と UI を直接叩けてしまう（DryEyes のログインを一切通らずに）。
    ports:
      - "127.0.0.1:5000:5000"
    # ntfy は別ネットワークのコンテナなので、ホスト経由で到達できるようにする
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      sockpuppetbrowser:
        condition: service_started

  sockpuppetbrowser:
    image: dgtlmoon/sockpuppetbrowser:latest
    container_name: dryeyes-browser
    hostname: sockpuppetbrowser
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=10
    # 監視対象ピッカーもクロールと同じブラウザで描画するため、BFF から直接つなげるようにする。
    # ここは CDP（ブラウザを遠隔操作する口）なので、外に開いたままにはしない。
    ports:
      - "127.0.0.1:3020:3000"
    restart: unless-stopped

volumes:
  changedetection-data:
