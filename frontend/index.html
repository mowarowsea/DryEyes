<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- SVG のファビコンを読まないブラウザ向けのフォールバック -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DryEyes — Web Watcher</title>

    <!-- ホーム画面に追加すると、Android の共有シートから直接 URL を渡せるようになる
         （共有先の定義は manifest の share_target を参照）。 -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#4f46e5" />
    <!-- 下のナビゲーションバーの色はアプリ側で塗る。
         viewport-fit=cover でページをナビバーの裏まで広げ、余白は safe-area-inset で空ける
         （ブラウザ任せにすると、端末がダークのときに白い帯へ白いボタンが乗って見えなくなる）。 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DryEyes" />
    <script>
      // 描画前にテーマを確定させる。React のマウントを待つと一瞬ライトテーマが見えてしまう。
      (function () {
        try {
          var mode = localStorage.getItem('dryeyes.theme') || 'system';
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* localStorage が使えない環境ではライトテーマのまま表示する */
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
